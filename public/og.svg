<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0e10" />
      <stop offset="100%" stop-color="#1b1b1f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#b8865b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#b8865b" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 0 80" fill="none" stroke="#fff" stroke-width="1" opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g transform="translate(80, 120)">
    <rect width="32" height="32" rx="6" fill="#0e0e10" stroke="#b8865b" stroke-width="1" />
    <text x="48" y="22" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#b8865b" letter-spacing="0.16em">АЛЮМИНИЕВЫЕ КОНСТРУКЦИИ</text>
  </g>

  <text x="80" y="320" font-family="Inter, sans-serif" font-size="92" font-weight="700" fill="#fff" letter-spacing="-0.03em">
    Алюминиевые
  </text>
  <text x="80" y="430" font-family="Inter, sans-serif" font-size="92" font-weight="700" fill="#b8865b" letter-spacing="-0.03em">
    конструкции
  </text>
  <text x="80" y="500" font-family="Inter, sans-serif" font-size="92" font-weight="700" fill="#fff" letter-spacing="-0.03em">
    под ключ
  </text>

  <text x="80" y="570" font-family="Inter, sans-serif" font-size="20" fill="#fff" opacity="0.6">
    Окна · Двери · Раздвижные системы · Фасады · Перголы · Перегородки
  </text>

  <text x="1120" y="570" font-family="Inter, sans-serif" font-size="20" fill="#b8865b" text-anchor="end">
    Алюмарк · Алютех · Татпроф
  </text>
</svg>
